    - dataverse-plugins
    - dataverse-web-api
    - dataverse-web-resources
    - pcf-controls
    - plan-with-team
    - power-apps-code-apps
    - record-screen
    - visual-qa

notes:
  - "Populate runtime and integration fields after bootstrap intake."
  - "Edit canonical skills under skills/power-platform, not adapter symlinks."
  - "Keep PROJECT_DNA.yaml focused on invariants."
