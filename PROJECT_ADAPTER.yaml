# PROJECT_ADAPTER.yaml - Optional project-specific adapter

version: "statedd-template-v3"

project:
  name: PowerBi_Probeersel
  short_name: PowerBi_Probeersel
  description: "Fair Workload & Evaluation Cockpit demo for trainer workload, evaluation context and management fairness signals."

vocabulary:
  control_plane_name: "control plane"
  state_plane_name: "state plane"
  evidence_plane_name: "evidence plane"
  runtime_identity_name: "runtime identity"

runtime:
  frontend_port: null
  api_port: null
  public_url: null
  execution_mode: operating
  runtime_identity_surface: Power BI Desktop report or exported report artifact

demo:
  product_name: Fair Workload & Evaluation Cockpit
  primary_user: manager or teamlead
  secondary_user: trainer
  data_mode: fictive_demo_data
  first_milestone: five-page Power BI MVP
  pages:
    - Management Overview
    - Trainer Workload
    - Vak & Categorie Analyse
    - Evaluatieanalyse
    - Fairness Signals

integrations:
  - name: Power BI
    status: planned
    purpose: report and analysis layer
  - name: Power App
    status: specified
    purpose: lightweight workload entry and enrichment
  - name: Outlook
    status: specified
    purpose: low-friction category source for calendar workload
  - name: AI feedback summary
    status: optional
    purpose: summarize open evaluation comments and suggest categories
skills:
  canonical_root: skills/power-platform
  adapters:
    claude: .claude/skills
    codex: .codex/skills
    kimi: .kimi/plugins
    gemini_context: GEMINI.md
    gemini_extension: .gemini/extensions/power-platform-skills
  installed:
    - code-review
    - dataverse-plugins
    - dataverse-web-api
    - dataverse-web-resources
    - pcf-controls
    - plan-with-team
    - power-apps-code-apps
    - record-screen
    - visual-qa

notes:
  - "Use fictive or anonymized data for demos."
  - "Frame fairness signals as conversation prompts, not verdicts."
  - "Edit canonical skills under skills/power-platform, not adapter symlinks."
  - "Keep PROJECT_DNA.yaml focused on invariants."
