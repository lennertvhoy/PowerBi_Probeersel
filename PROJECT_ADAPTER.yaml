# PROJECT_ADAPTER.yaml - Optional project-specific adapter

version: "statedd-template-v3"

project:
  name: PowerBi_Probeersel
  short_name: PowerBi_Probeersel
  description: "Bootstrap adapter for a Power BI / Power Platform project; product-specific details are still unknown."

